  - id: bukhari-6573
    type: hadith
    used_in: NOT shown any more (2026-11-21: no hooks are depicted; nothing curved or alive-looking is shown); kept here
      as background for the bridge
    reference: Sahih al-Bukhari 6573 (Book of Riqaq), narrated by Abu Hurairah
    grade: sahih
    grader: al-Bukhari (included in his Sahih)
    detail_used: "over that bridge there will be hooks Similar to the thorns of As Sa'dan ... except that their greatness
      in size is only known to Allah. These hooks will snatch the people according to their deeds."
    link: https://sunnah.com/bukhari:6573
    text_checked_from: hadith/eng-bukhari_6573.json, hadith/ara-bukhari_6573.json (fawazahmed0/hadith-api, the
