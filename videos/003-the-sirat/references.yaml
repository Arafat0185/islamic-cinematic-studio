    checked_on: 2026-11-20

  - id: bukhari-7439
    type: hadith
    used_in: the people crossing at different speeds, the scratched, the last one dragged (tag "SAHIH AL-BUKHARI 7439 ·
      MUSLIM 183" while the crossers are on screen); no text of it is quoted
    reference: Sahih al-Bukhari 7439 (Book of Tawhid), narrated by Abu Sa'id al-Khudri; its parallel is Sahih Muslim 183
    grade: sahih
    grader: al-Bukhari; Muslim (both include it)
    detail_used: "Some of the believers will cross the bridge as quickly as the wink of an eye, some others as quick as
      lightning, a strong wind, fast horses or she-camels. So some will be safe without any harm; some will be safe
      after receiving some scratches, and some will fall down into Hell (Fire). The last person will cross by being
      dragged (over the bridge)."
    link: https://sunnah.com/bukhari:7439 ; https://sunnah.com/muslim:183a
    text_checked_from: hadith/eng-bukhari_7439.json, hadith/ara-bukhari_7439.json
    checked_on: 2026-11-20

